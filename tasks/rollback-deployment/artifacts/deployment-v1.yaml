apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: storefront
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.25.3
        ports:
        - containerPort: 80
