apiVersion: batch/v1
kind: CronJob
metadata:
  name: usage-report
  namespace: reporting
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  # The problem: the CronJob was suspended (e.g. during an incident) and never resumed.
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: report
            image: busybox:1.36
            command: ["sh", "-c", "echo generating usage report; sleep 2; echo done"]
