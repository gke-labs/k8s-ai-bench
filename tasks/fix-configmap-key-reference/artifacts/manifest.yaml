apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: notifications
data:
  SMTP_HOST: smtp.internal.example.com
  SMTP_PORT: "587"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: nginx:1.27
        ports:
        - containerPort: 80
        env:
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: notification-config
              # The problem: the ConfigMap key is SMTP_HOST, not smtp_host.
              # The kubelet fails with CreateContainerConfigError.
              key: smtp_host
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: notification-config
              key: SMTP_PORT
