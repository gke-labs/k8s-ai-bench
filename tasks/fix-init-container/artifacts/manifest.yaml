apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-db
  namespace: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-db
  template:
    metadata:
      labels:
        app: checkout-db
    spec:
      containers:
      - name: db
        # Stands in for a database; listens on 5432 so TCP checks succeed.
        image: busybox:1.36
        command: ["sh", "-c", "while true; do nc -l -p 5432 -e echo ok; done"]
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-db
  namespace: checkout
spec:
  selector:
    app: checkout-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        # The problem: the service is named checkout-db, not checkout-database.
        # The init container waits forever, so the pod is stuck in Init:0/1.
        command:
        - sh
        - -c
        - |
          until nc -z -w 2 checkout-database 5432; do
            echo "waiting for database..."
            sleep 2
          done
      containers:
      - name: checkout-api
        image: nginx:1.27
        ports:
        - containerPort: 80
