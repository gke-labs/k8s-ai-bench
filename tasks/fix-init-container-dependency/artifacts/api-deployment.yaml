apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: analytics
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done
      containers:
      - name: api
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
