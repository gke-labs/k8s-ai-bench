apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: analytics
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
